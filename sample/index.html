<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sample YearMap</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-290HM1TX70"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-290HM1TX70');
  </script>
  <script defer src="/assets/posthog.js"></script>
  <meta name="description" content="Open a sample read-only YearMap calendar." />
  <link rel="icon" href="/favicon.ico" />
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f8;color:#171717}
    main{max-width:520px;padding:32px;text-align:center}
    a{color:#257f78;font-weight:700}
  </style>
</head>
<body data-analytics-page="sample">
  <main>
    <h1>Opening a sample YearMap...</h1>
    <p>If nothing happens, <a id="sample-link" href="/view/">open the sample calendar</a>.</p>
  </main>
  <script>
    const snapshot = {
      v: 1,
      year: 2026,
      createdAt: '2026-07-05T12:00:00.000Z',
      settings: { alignWeekdays: true, weekendHighlight: true },
      categories: [
        { id: 'work-travel', label: 'Work travel', color: '#ff6b6b' },
        { id: 'family', label: 'Family vacation', color: '#5cc7bd' },
        { id: 'school', label: 'School PTA meeting', color: '#4d9be6' },
        { id: 'soccer', label: 'Soccer games', color: '#f5a623' }
      ],
      ranges: [
        { id: 'r1', categoryId: 'family', startDate: '2026-06-02', endDate: '2026-06-08', note: 'Lake week' },
        { id: 'r2', categoryId: 'work-travel', startDate: '2026-09-07', endDate: '2026-09-11', note: 'Conference' },
        { id: 'r3', categoryId: 'work-travel', startDate: '2026-11-09', endDate: '2026-11-13', note: 'Client onsite' },
        { id: 'r4', categoryId: 'soccer', startDate: '2026-10-10', endDate: '2026-10-10', note: 'Tournament' },
        { id: 'r5', categoryId: 'soccer', startDate: '2026-10-17', endDate: '2026-10-17', note: 'Home game' },
        { id: 'r6', categoryId: 'school', startDate: '2026-08-24', endDate: '2026-08-24', note: 'First day back' },
        { id: 'r7', categoryId: 'family', startDate: '2026-12-21', endDate: '2026-12-28', note: 'Winter break' },
        { id: 'r8', categoryId: 'school', startDate: '2026-11-18', endDate: '2026-11-18', note: 'PTA meeting' }
      ]
    };

    function encodeSnapshot(value) {
      const json = JSON.stringify(value);
      const base64 = btoa(json).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      return `/view/?sample=1#ym1.json.${base64}`;
    }

    const url = encodeSnapshot(snapshot);
    document.getElementById('sample-link').href = url;

    function openSampleCalendar() {
      window.YearMapAnalytics?.track?.('sample_calendar_opened', {
        category_count: snapshot.categories.length,
        range_count: snapshot.ranges.length,
        sample_year: snapshot.year
      });

      window.setTimeout(() => window.location.replace(url), 180);
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', openSampleCalendar, { once: true });
    } else {
      openSampleCalendar();
    }
  </script>
</body>
</html>
